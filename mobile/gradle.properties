# Gradle
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 + Kotlin Multiplatform geçici uyumluluk.
#
# AGP 9.0'dan itibaren `com.android.application` plugin'i
# `org.jetbrains.kotlin.multiplatform` ile doğrudan uyumlu değil; yeni
# `com.android.kotlin.multiplatform.library` plugin'ine geçiş gerekiyor.
# O geçiş yapılana kadar built-in Kotlin ve yeni DSL kapalı — mevcut
# `kotlinMultiplatform` + `androidTarget` yapısı çalışmaya devam eder.
#
# KALDIRMA: bu iki satır silinirse build hiç başlamaz.
android.builtInKotlin=false
android.newDsl=false

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=true
android.native.ignoreDisabledTargets=true
