name: mobile-ci

# Yalnızca Android. iOS ayrı workflow'da (mobile-ios.yml) — gerekçe aşağıda.
#
# Neden ayrıldı: macOS runner'ları GitHub'da kapasite kısıtlı ve kuyrukta
# 15 dakika bekleyip düşebiliyor ("not acquired by Runner of type hosted").
# Bu, kodu hiç çalıştırmadan kırmızı bir job üretiyordu ve gerçek Android
# hatasını gürültü içinde gizliyordu. Android 40 saniyede geri bildirim
# veriyor; iOS ise yalnızca Kotlin/Native kod değiştiğinde anlamlı.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Derlemeden ÖNCE: trailing-lambda tuzağı gibi hataları 2 dakika
      # beklemek yerine anında yakala (üç kez tekrarlandı).
      - name: Compose kuralları
        run: node scripts/check-compose-conventions.mjs

      - name: Kotlin import kontrolü
        run: node scripts/check-kotlin-imports.mjs

      - name: Unit tests (commonTest)
        working-directory: mobile
        run: ./gradlew :composeApp:allTests --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      # App Links doğrulaması: APK'nın imza parmak izi assetlinks.json
      # ile eşleşmezse https linkleri tarayıcıda kalır — sessiz hata.
      # Bu adım eşleşmeyi her derlemede kanıtlar.
      - name: App Links parmak izi doğrula
        working-directory: mobile
        run: |
          APK=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          # apksigner iki nokta üst üste olmadan yazar; assetlinks
          # iki nokta ile. Karşılaştırma için ikisini de normalleştir.
          ACTUAL=$($APKSIGNER verify --print-certs "$APK" | grep -i "SHA-256" | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')
          EXPECTED=$(grep -o '"[0-9a-f:]*"' ../frontend/public/.well-known/assetlinks.json | head -1 | tr -d '"' | tr -d ' :' | tr 'A-F' 'a-f')
          echo "APK      : $ACTUAL"
          echo "assetlinks: $EXPECTED"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "✅ App Links parmak izi eşleşiyor"
          else
            echo "::error::App Links parmak izi EŞLEŞMİYOR — https linkleri tarayıcıda kalır"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dugunce-debug-apk
          path: mobile/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14
