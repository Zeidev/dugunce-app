name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dugunce_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/dugunce_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-chars-long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # `tsconfig.json` testleri HARİÇ tutuyor (`exclude: tests`), yani
      # `npm run typecheck` test dosyalarını HİÇ derlemiyor. Sonuç: test
      # kodundaki tip hataları (ve arayüz daraltmasını gizleyen `as`
      # cast'leri) CI'dan kaçıyordu. Admin testleri ayrıca sıkı denetlenir.
      - name: Typecheck admin tests (strict)
        working-directory: backend
        run: |
          npx tsc --noEmit --strict --noUncheckedIndexedAccess --skipLibCheck \
            --module esnext --moduleResolution bundler --target es2022 \
            --types node tests/admin/*.test.ts

      - name: Verify migration SQL (PGlite — fast feedback)
        working-directory: backend
        run: npm run verify:migrations

      - name: Run migrations (real PostgreSQL)
        working-directory: backend
        run: npm run db:migrate -- --force

      - name: DB erişimi doğrula (CI teşhis)
        working-directory: backend
        run: node scripts/ci-db-check.mjs

      # dist/ testlerden ÖNCE gerekli: tests/config/deps.test.ts derlenmiş
      # çıktıyı tarar ve her çalışma zamanı import'unun `dependencies`'te
      # olduğunu doğrular. Build burada değilse test ENOENT ile düşer.
      - name: Build
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        shell: bash
        # `set -o pipefail` ZORUNLU. GitHub'ın varsayılan bash'i `bash -e`,
        # pipefail kapalı: `vitest | tee` boru hattının çıkış kodu tee'dir,
        # yani vitest düşse bile job YEŞİL kalır. Run 41439711777 tam olarak
        # bunu yaptı: 1 test FAIL, job success.
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee /tmp/test-output.log

      # Test çıktısını artifact olarak yükle — hata olsa bile indirilebilir.
      # Log API'si admin hakkı istiyor; artifact halka açık.
      - name: Test çıktısını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.log
          retention-days: 7

      - name: Verify build output exists
        working-directory: backend
        run: test -f dist/server.js

      - name: Check for leaked secrets in build output
        working-directory: backend
        run: |
          if grep -rIl -E 'postgres://[^@]+@|sk_live_|BEGIN (RSA |EC )?PRIVATE KEY' dist/ 2>/dev/null; then
            echo "::error::Build output contains what looks like a secret"
            exit 1
          fi
          echo "No secrets found in build output"
