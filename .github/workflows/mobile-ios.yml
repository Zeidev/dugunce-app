name: mobile-ios

# iOS framework derlemesi — ELLE tetiklenir, her push'ta değil.
#
# Neden ayrı ve elle:
# - macOS runner'ları GitHub'da kapasite kısıtlı; kuyrukta 15 dk bekleyip
#   "not acquired by Runner of type hosted" ile düşebiliyor. Bu, kodu hiç
#   çalıştırmadan kırmızı job üretir ve gerçek hatayı gizler.
# - iOS derlemesi yalnızca Kotlin/Native tarafı değiştiğinde yeni bilgi
#   verir. Android (mobile-ci) zaten 40 saniyede geri bildirim veriyor.
# - macOS dakikaları ücretsiz kotadan düşüyor (2000 dk/ay).
#
# Ne zaman çalıştır:
#   gh workflow run mobile-ios.yml
#   → sürüm hazırlığında, Kotlin/Native veya iOS'a özgü kod değiştiğinde,
#     ve iOS uygulamasını gerçekten açmadan önce.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Neden çalıştırıyorsunuz (log için)'
        required: false
        type: string
        default: 'manuel doğrulama'

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS framework build
    runs-on: macos-latest
    # Kuyrukta bekleme süresi ayrı; derleme kendisi ~9 dk.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Amaç
        run: |
          echo "Tetikleme sebebi: ${{ inputs.reason }}"

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-ios-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/libs.versions.toml') }}
          restore-keys: gradle-ios-

      # Kotlin/Native kodunun iOS için DERLENDİĞİNİ doğrular.
      # NOT: İmzalama sertifikası olmadan .ipa üretilemez.
      - name: Build iOS framework
        working-directory: mobile
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: dugunce-ios-framework
          path: mobile/composeApp/build/bin/iosSimulatorArm64/debugFramework/
          retention-days: 30
