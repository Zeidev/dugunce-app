<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4a5f45">
<title>Görevlerim — Düğünce</title>
<!--
  Yardımcı uygulaması. UYGULAMA KURULMAZ, HESAP YOK.
  Erişim yalnızca URL fragment'indeki token ile (#token).
  Fragment sunucuya gitmez, erişim loglarına düşmez.
-->
<style>
  /* ===================================================================
     Görsel dil — landing sayfasıyla aynı (Playfair + Josefin, krem/sage/altın)
     =================================================================== */
  @font-face{font-family:'Playfair Display';font-weight:600;font-display:swap;
    src:url('/assets/fonts/playfair-display-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:'Playfair Display';font-weight:600;font-display:swap;
    src:url('/assets/fonts/playfair-display-latin.woff2') format('woff2')}
  @font-face{font-family:'Josefin Sans';font-weight:400;font-display:swap;
    src:url('/assets/fonts/josefin-sans-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:'Josefin Sans';font-weight:400;font-display:swap;
    src:url('/assets/fonts/josefin-sans-latin.woff2') format('woff2')}
  @font-face{font-family:'Josefin Sans';font-weight:600;font-display:swap;
    src:url('/assets/fonts/josefin-sans-600-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:'Josefin Sans';font-weight:600;font-display:swap;
    src:url('/assets/fonts/josefin-sans-600-latin.woff2') format('woff2')}

  :root{
    --cream:#f4f2ee;--surface:#fff;--surface-alt:#faf8f4;
    --ink:#2d3a2e;--muted:#746e65;--line:#e6e1d8;
    --sage:#4a5f45;--sage-deep:#3b4c37;--sage-soft:#eef2ec;--sage-border:#d6e0d2;
    --gold:#a8925f;--gold-text:#7c6c46;--gold-soft:#f0ece0;
    --doing:#b8863b;--danger:#a35b4a;
    --radius:16px;--sheet-radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:'Josefin Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 0 40px;position:relative;min-height:100vh}

  /* --- Başlık --- */
  .head{padding:20px 20px 14px}
  .brand{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold-text);margin:0 0 8px;font-weight:600}
  .greet{font-family:'Playfair Display',Georgia,serif;font-size:24px;
    font-weight:600;margin:0 0 3px;letter-spacing:-.01em;line-height:1.25}
  .couple{font-size:13px;color:var(--muted);margin:0}

  /* --- Filtre sekmeleri --- */
  .tabs{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
    background:var(--cream);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--surface);color:var(--muted);white-space:nowrap;
    min-height:44px}
  .tab[aria-selected="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
  .tab .n{font-weight:400;margin-left:4px}
  .tab:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

  /* --- Liste --- */
  #list{padding:16px 16px 32px;display:flex;flex-direction:column;gap:10px}

  .card{background:var(--surface);border-radius:var(--radius);padding:16px;
    margin:0 0 12px;box-shadow:0 1px 3px rgba(45,58,46,.05)}

  .task{background:var(--surface);border-radius:var(--radius);padding:16px;
    border:1.5px solid transparent;cursor:pointer;
    box-shadow:0 1px 3px rgba(45,58,46,.05);transition:border-color .15s;
    display:block;width:100%;text-align:left;font:inherit;color:inherit}
  .task:active{border-color:var(--sage-border)}
  .task:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
  .task.done{opacity:.80}
  .t-title{font-size:15px;font-weight:600;margin:0 0 6px;letter-spacing:-.005em;
    word-break:break-word;overflow-wrap:anywhere}
  .task.done .t-title{text-decoration:line-through;text-decoration-thickness:1.5px}
  .t-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
    letter-spacing:.02em;white-space:nowrap}
  /* Rozet renkleri WCAG AA (>=4.5:1) — olculdu:
     TODO  6.40  (#5a554a / #f0eeea)
     DOING 5.10  (#8a5f1f / #fbf3e4)  — once 2.92 idi, AA alti
     DONE  8.15  (#3b4c37 / #eef2ec) */
  .badge.TODO{background:#f0eeea;color:#5a554a}
  .badge.DOING{background:#fbf3e4;color:#8a5f1f}
  .badge.DONE{background:var(--sage-soft);color:#3b4c37}
  .due{font-size:12px;color:var(--muted)}
  .due.soon{color:#8a3f2f;font-weight:600}
  .msgcount{font-size:12px;color:var(--gold-text);font-weight:600;margin-left:auto}

  /* --- Görev sayfası (alttan) --- */
  .scrim{position:fixed;inset:0;background:rgba(26,29,23,.32);
    opacity:0;pointer-events:none;transition:opacity .24s;z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:86vh;display:flex;flex-direction:column;z-index:21;
    box-shadow:0 -8px 32px rgba(45,58,46,.14)}
  /* Kapalı panel EKRAN OKUYUCUYA VE TAB SIRASINA KAPALI olmalı.
     Yalnız `transform` ile ekran dışına taşımak yetmez: Tab hâlâ
     içindeki butonlara gider, ekran okuyucu iki aria-modal diyalog
     ilan eder. `visibility:hidden` ikisini de çözer. */
  .sheet{visibility:hidden}
  .sheet.on{transform:translateY(0);visibility:visible}
  .handle{width:38px;height:4px;border-radius:2px;background:var(--line);
    margin:10px auto 4px;flex:none;cursor:grab;touch-action:none}
  .sheet-body{overflow-y:auto;padding:8px 20px 28px;
    -webkit-overflow-scrolling:touch}
  .s-title{font-family:'Playfair Display',Georgia,serif;font-size:21px;
    font-weight:600;margin:6px 0 18px;line-height:1.3;
    word-break:break-word;overflow-wrap:anywhere}
  .s-title:focus{outline:none}
  .sec-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold-text);font-weight:600;margin:0 0 10px}
  .status-row{display:flex;gap:8px;margin:0 0 22px}
  .status-row button{flex:1;font:inherit;font-size:13px;font-weight:600;
    cursor:pointer;padding:13px 8px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
    min-height:44px}
  .status-row button[aria-pressed="true"]{background:var(--sage);
    color:#fff;border-color:var(--sage)}
  .status-row button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
  .desc{font-size:14px;color:var(--ink);margin:0 0 22px;white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere}
  .desc.empty{color:var(--muted);font-style:italic}
  .chat-link{display:flex;align-items:center;gap:12px;width:100%;
    font:inherit;text-align:left;cursor:pointer;
    padding:16px;border-radius:14px;border:1.5px solid var(--sage-border);
    background:var(--sage-soft);color:var(--ink);min-height:56px}
  .chat-link:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
  .chat-link .lbl{flex:1;font-weight:600;font-size:14px}
  .chat-link .cnt{font-size:12px;color:var(--sage);font-weight:600}
  .chat-link .arrow{color:var(--sage);font-size:18px}

  /* --- Sohbet ekranı --- */
  .chat-screen{position:fixed;inset:0;background:var(--cream);
    display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:30}
  .chat-screen{visibility:hidden}
  .chat-screen.on{transform:translateX(0);visibility:visible}
  .chat-head{flex:none;display:flex;align-items:center;gap:10px;
    padding:16px 16px 14px;border-bottom:1px solid var(--line);
    background:var(--cream);padding-top:calc(16px + env(safe-area-inset-top))}
  .back{font:inherit;font-size:24px;line-height:1;background:none;border:0;
    color:var(--sage);cursor:pointer;padding:8px;margin:-8px;min-width:44px;
    min-height:44px}
  .back:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:8px}
  .chat-title{font-size:14px;font-weight:600;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-sub{font-size:11px;color:var(--muted);font-weight:400}

  .msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;
    flex-direction:column;gap:10px;align-items:flex-start;
    -webkit-overflow-scrolling:touch}
  .msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;
    line-height:1.5;word-break:break-word;overflow-wrap:anywhere;
    white-space:pre-wrap;text-align:left}
  .msg.COUPLE{background:var(--surface);color:var(--ink);
    align-self:flex-start;border-bottom-left-radius:5px;
    box-shadow:0 1px 2px rgba(45,58,46,.05)}
  .msg.HELPER{background:var(--sage);color:#fff;align-self:flex-end;
    border-bottom-right-radius:5px}
  .msg .who{display:block;font-size:10px;opacity:.72;margin:0 0 3px;
    font-weight:600;letter-spacing:.03em}
  .msgs-empty{color:var(--muted);font-size:13px;font-style:italic;margin:0}

  .composer{flex:none;display:flex;gap:8px;padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line)}
  .composer input{flex:1;font:inherit;font-size:15px;padding:12px 16px;
    border-radius:12px;border:1.5px solid var(--line);background:var(--cream);
    min-width:0;color:var(--ink);min-height:44px}
  .composer input:focus{outline:none;border-color:var(--sage)}
  .composer button{font:inherit;font-weight:600;font-size:14px;padding:0 20px;
    border-radius:12px;border:0;background:var(--sage);color:#fff;
    cursor:pointer;min-height:44px}
  .composer button:disabled{opacity:.5;cursor:not-allowed}
  .composer button:focus-visible{outline:2px solid var(--sage-deep);outline-offset:2px}

  /* --- Durum ekranları --- */
  .center{text-align:center;padding:48px 8px}
  .center h2{font-size:18px;margin:0 0 8px;font-weight:600}
  .center p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .center p:last-child{margin-bottom:0}
  .spinner{width:26px;height:26px;margin:0 auto 18px;border-radius:50%;
    border:2.5px solid var(--line);border-top-color:var(--sage);
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .retry{font:inherit;font-weight:600;font-size:14px;padding:12px 22px;
    border-radius:12px;border:1.5px solid var(--sage);background:var(--surface);
    color:var(--sage);cursor:pointer;min-height:44px}

  .toast{position:fixed;left:50%;bottom:24px;
    transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;
    border-radius:999px;opacity:0;transition:transform .22s ease,opacity .22s ease;
    pointer-events:none;z-index:40;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{background:var(--danger)}

  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head" id="head" hidden>
    <p class="brand">Düğünce · Görevlerim</p>
    <h1 class="greet" id="greeting"></h1>
    <p class="couple" id="coupleLine"></p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Görev filtresi" hidden></nav>

  <div id="list" hidden></div>

  <div class="card" id="loading">
    <div class="center">
      <div class="spinner" aria-hidden="true"></div>
      <p>Yükleniyor…</p>
    </div>
  </div>

  <div class="card" id="error" hidden>
    <div class="center">
      <h2 id="errorTitle">Bağlantı kurulamadı</h2>
      <p id="errorText">Bu bağlantının süresi dolmuş veya erişimi kapatılmış olabilir.<br>Lütfen çift ile iletişime geçin.</p>
      <button type="button" class="retry" id="retryBtn">Tekrar dene</button>
    </div>
  </div>

  <div class="card" id="empty" hidden>
    <div class="center">
      <p>Henüz size atanmış bir görev yok.</p>
    </div>
  </div>
</div>

<!-- Görev sayfası (alttan açılır) -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="handle" id="sheetHandle"></div>
  <div class="sheet-body">
    <h2 class="s-title" id="sheetTitle" tabindex="-1"></h2>

    <p class="sec-label">Durum</p>
    <div class="status-row" id="statusRow" role="group" aria-label="Görev durumu"></div>

    <p class="sec-label">Açıklama</p>
    <p class="desc" id="sheetDesc"></p>

    <button type="button" class="chat-link" id="chatLink">
      <span aria-hidden="true">💬</span>
      <span class="lbl">Mesajlar</span>
      <span class="cnt" id="chatCount">0</span>
      <span class="arrow" aria-hidden="true">›</span>
    </button>
  </div>
</div>

<!-- Sohbet (tam ekran) -->
<div class="chat-screen" id="chat" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
  <div class="chat-head">
    <button type="button" class="back" id="backBtn" aria-label="Geri">‹</button>
    <div style="flex:1;min-width:0">
      <div class="chat-title" id="chatTitle"></div>
      <div class="chat-sub" id="chatSub"></div>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="composer">
    <input type="text" id="msgInput" placeholder="Mesaj yaz…" maxlength="4000"
           aria-label="Mesaj" autocomplete="off">
    <button type="button" id="sendBtn">Gönder</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
const API = 'https://api.dugunce.com.tr/api/v1'
const STATUS_LABELS = { TODO: 'Yapılacak', DOING: 'Yapılıyor', DONE: 'Bitti' }
const FILTERS = [
  { key: 'ALL', label: 'Tümü' },
  { key: 'TODO', label: 'Yapılacak' },
  { key: 'DOING', label: 'Yapılıyor' },
  { key: 'DONE', label: 'Bitti' },
]

const state = {
  token: '',
  csrf: '',
  helperName: '',
  coupleNames: '',
  tasks: [],
  openTaskId: null,
  messages: {},   // taskId -> Message[]
  filter: 'ALL',
  lastFocused: null,
  hasOlder: {},   // taskId -> daha eski mesaj var mı
}

const $ = (id) => document.getElementById(id)

/**
 * Token YALNIZ `#fragment`'ten okunur.
 *
 * YOL TABANLI OKUMA KALDIRILDI: `/h/<token>` biçimi token'ı HTTP istek
 * satırına koyar — sunucu erişim loglarına, CDN loglarına ve Referer
 * başlığına düşer. Fragment ise sunucuya hiç gitmez (spec §3).
 *
 * Not: `_redirects` içinde `/d/:token → /d/#:token` kuralı var ama
 * `/h/` için eşdeğeri YOK; yol biçimi bugün 404 dönerdi — yani ölü
 * koddu, ama kurulu bir tuzaktı.
 */
function getToken() {
  return location.hash.replace(/^#/, '')
}

function toast(msg, isError = false) {
  const el = $('toast')
  el.textContent = msg
  el.className = 'toast show' + (isError ? ' err' : '')
  clearTimeout(toast._t)
  toast._t = setTimeout(() => { el.className = 'toast' }, 2600)
}

function show(which) {
  $('loading').hidden = which !== 'loading'
  $('error').hidden = which !== 'error'
  const listMode = which === 'list'
  $('head').hidden = !listMode
  $('tabs').hidden = !listMode
  $('list').hidden = !listMode
  if (!listMode) $('empty').hidden = true
}

function formatDate(d) {
  if (!d) return ''
  try {
    // Yıl da yazılır: düğün bir sonraki yıla sarkarsa "5 Ocak" belirsiz kalır.
    return new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(d))
  } catch { return '' }
}

/** Tarih yakın mı? (7 gün içinde) */
function isSoon(d) {
  if (!d) return false
  try {
    const diff = new Date(d).getTime() - Date.now()
    return diff >= 0 && diff < 7 * 86400000
  } catch { return false }
}

// ===========================================================================
// Filtre sekmeleri
// ===========================================================================

function renderTabs() {
  const nav = $('tabs')
  // Odak korunur: sekmeler her durum degisiminde yeniden olusturuluyor;
  // klavye kullanicisi odagini kaybetmesin.
  const focusedKey = document.activeElement?.dataset?.['filterKey'] ?? null
  nav.textContent = ''

  for (const f of FILTERS) {
    const count = f.key === 'ALL'
      ? state.tasks.length
      : state.tasks.filter((t) => t.status === f.key).length

    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'tab'
    btn.setAttribute('role', 'tab')
    btn.setAttribute('aria-selected', String(state.filter === f.key))
    btn.setAttribute('aria-label', `${count} ${f.label.toLowerCase()} görev`)

    btn.append(document.createTextNode(f.label + ' '))
    const n = document.createElement('span')
    n.className = 'n'
    n.textContent = String(count)
    btn.append(n)

    btn.dataset['filterKey'] = f.key
    btn.addEventListener('click', () => {
      state.filter = f.key
      renderTabs()
      renderList()
    })
    nav.append(btn)
  }

  // Odagi geri ver
  if (focusedKey) {
    const again = nav.querySelector(`[data-filter-key="${CSS.escape(focusedKey)}"]`)
    if (again) again.focus()
  }
}

// ===========================================================================
// Liste
// ===========================================================================

/** Kartın görünen kısmını doldurur (rozet + meta). */
function fillCard(card, task) {
  card.textContent = ''
  card.className = 'task' + (task.status === 'DONE' ? ' done' : '')

  const title = document.createElement('p')
  title.className = 't-title'
  title.textContent = task.title

  const meta = document.createElement('div')
  meta.className = 't-meta'

  const badge = document.createElement('span')
  badge.className = 'badge ' + task.status
  badge.textContent = STATUS_LABELS[task.status] ?? task.status
  meta.append(badge)

  if (task.dueDate) {
    const due = document.createElement('span')
    due.className = 'due' + (isSoon(task.dueDate) && task.status !== 'DONE' ? ' soon' : '')
    due.textContent = formatDate(task.dueDate)
    meta.append(due)
  }

  const msgN = state.messages[task.id]?.length ?? 0
  if (msgN > 0) {
    const c = document.createElement('span')
    c.className = 'msgcount'
    c.textContent = msgN + ' mesaj'
    meta.append(c)
  }

  card.append(title, meta)
}

function buildTask(task) {
  const card = document.createElement('article')
  card.setAttribute('role', 'button')
  card.setAttribute('tabindex', '0')
  card.dataset['taskId'] = task.id
  fillCard(card, task)

  const open = () => {
    state.lastFocused = card
    openSheet(task.id)
  }
  card.addEventListener('click', open)
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open() }
  })
  return card
}

function renderList() {
  const list = $('list')
  const scroll = list.scrollTop
  list.textContent = ''

  const visible = state.filter === 'ALL'
    ? state.tasks
    : state.tasks.filter((t) => t.status === state.filter)

  if (visible.length === 0) {
    $('empty').hidden = false
    list.hidden = true
    return
  }
  $('empty').hidden = true
  list.hidden = false

  for (const t of visible) list.append(buildTask(t))
  list.scrollTop = scroll   // kaydırma konumu korunur
}

// ===========================================================================
// Görev sayfası
// ===========================================================================

let sheetEsc = null

function openSheet(taskId) {
  const task = state.tasks.find((t) => t.id === taskId)
  if (!task) return

  state.openTaskId = taskId

  $('sheetTitle').textContent = task.title
  const desc = $('sheetDesc')
  desc.textContent = task.description || 'Açıklama yok'
  desc.className = 'desc' + (task.description ? '' : ' empty')

  // Durum butonları
  const row = $('statusRow')
  row.textContent = ''
  for (const s of ['TODO', 'DOING', 'DONE']) {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = STATUS_LABELS[s]
    b.setAttribute('aria-pressed', String(task.status === s))
    b.addEventListener('click', () => {
      if (task.status !== s) changeStatus(taskId, s)
    })
    row.append(b)
  }

  // Mesaj sayısı
  $('chatCount').textContent = String(state.messages[taskId]?.length ?? 0)

  $('scrim').classList.add('on')
  $('sheet').classList.add('on')
  $('sheetTitle').focus()

  // ESKİ DİNLEYİCİYİ KALDIR — yoksa her açılışta bir tane birikir.
  // Akış: kart → sheet → sohbet → geri → sheet (yeni dinleyici, eskisi
  // kalır) → kapat (yalnız yenisi kalkar) → orphan dinleyici sonsuza dek.
  if (sheetEsc) { document.removeEventListener('keydown', sheetEsc); sheetEsc = null }
  sheetEsc = (e) => { if (e.key === 'Escape') closeSheet() }
  document.addEventListener('keydown', sheetEsc)

  // Mesaj sayısı ve geçmişi hemen yükle (aksi halde "Mesajlar 0" görünür).
  loadMessages(taskId)
}

function closeSheet() {
  // Sohbet açıksa Escape ÖNCE onu kapatmalı. İki `keydown` dinleyicisi
  // aynı anda kayıtlı; panel önce kapanırsa `closeChat` panele dönemez
  // (openTaskId null olmuş olur) ve kullanıcı doğrudan listeye düşer.
  if ($('chat').classList.contains('on')) return
  $('scrim').classList.remove('on')
  $('sheet').classList.remove('on')
  if (sheetEsc) { document.removeEventListener('keydown', sheetEsc); sheetEsc = null }
  if (state.lastFocused) { state.lastFocused.focus(); state.lastFocused = null }
  // Açık görev yok artık: polling gereksiz mesaj isteği atmasın.
  state.openTaskId = null
}

/** Tutamağı aşağı çekerek kapatma. */
function initSheetDrag() {
  const handle = $('sheetHandle')
  const sheet = $('sheet')
  let startY = null

  handle.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY
  }, { passive: true })

  handle.addEventListener('touchmove', (e) => {
    if (startY === null) return
    const dy = e.touches[0].clientY - startY
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`
  }, { passive: true })

  handle.addEventListener('touchend', (e) => {
    if (startY === null) return
    const dy = (e.changedTouches[0]?.clientY ?? startY) - startY
    sheet.style.transform = ''
    if (dy > 80) closeSheet()
    startY = null
  })
}

// ===========================================================================
// Sohbet
// ===========================================================================

let chatEsc = null

function openChat(taskId) {
  const task = state.tasks.find((t) => t.id === taskId)
  if (!task) return

  state.openTaskId = taskId
  $('chatTitle').textContent = task.title
  $('chatSub').textContent = state.coupleNames
  renderMessages(taskId)

  $('chat').classList.add('on')
  $('msgInput').focus()
  loadMessages(taskId)

  chatEsc = (e) => { if (e.key === 'Escape') closeChat() }
  document.addEventListener('keydown', chatEsc)
}

function closeChat() {
  $('chat').classList.remove('on')
  if (chatEsc) { document.removeEventListener('keydown', chatEsc); chatEsc = null }
  // Panele geri dön
  const taskId = state.openTaskId
  state.openTaskId = null
  if (taskId) openSheet(taskId)
}

function renderMessages(taskId) {
  const box = $('msgs')

  // ÖLÇÜM TEMİZLEMEDEN ÖNCE: `textContent=''` scrollTop'u sıfırlar,
  // sonra ölçmek "hep en altta" gibi yanlış sonuç verir.
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 8
  const prevCount = Number(box.dataset['msgCount'] ?? '0')
  const msgsAll = state.messages[taskId] ?? []
  const shouldScroll = atBottom || msgsAll.length > prevCount

  box.textContent = ''

  // Daha eski mesajlar varsa başa düğme koy (geçmiş sessizce kaybolmasın).
  if (state.hasOlder[taskId]) {
    const older = document.createElement('button')
    older.type = 'button'
    older.className = 'retry'
    older.style.cssText = 'align-self:center;font-size:13px;padding:10px 18px;margin:0 0 6px'
    older.textContent = 'Daha eski mesajlar'
    older.addEventListener('click', () => {
      const msgs = state.messages[taskId] ?? []
      const oldest = msgs[msgs.length - 1]
      if (oldest) loadMessages(taskId, oldest.id)
    })
    box.append(older)
  }

  const msgs = state.messages[taskId] ?? []
  if (msgs.length === 0) {
    const p = document.createElement('p')
    p.className = 'msgs-empty'
    p.textContent = 'Henüz mesaj yok.'
    box.append(p)
    return
  }

  // Kullanıcı geçmişi okuyorsa aşağı fırlatma: yalnız zaten en alttaysa
  // veya yeni mesaj geldiyse en alta in.
  box.dataset['msgCount'] = String(msgs.length)

  // Eski → yeni
  for (const m of [...msgs].reverse()) {
    const div = document.createElement('div')
    div.className = 'msg ' + m.senderKind
    const who = document.createElement('span')
    who.className = 'who'
    who.textContent = m.senderKind === 'COUPLE' ? state.coupleNames : 'Siz'
    const txt = document.createElement('span')
    txt.textContent = m.body
    div.append(who, txt)
    box.append(div)
  }
  if (shouldScroll) box.scrollTop = box.scrollHeight
}

/**
 * Mesajları yükler.
 *
 * `limit=100` = backend `MAX_PAGE_SIZE`. Varsayılan 30'du ve uzun
 * yazışmada geçmiş SESSİZCE kayboluyordu.
 *
 * `before` verilirse daha eski mesajlar istenir (sayfalama).
 */
async function loadMessages(taskId, before) {
  try {
    const q = new URLSearchParams({ limit: '100' })
    if (before) q.set('before', before)
    const res = await apiFetch(`/helper/tasks/${taskId}/messages?${q}`)
    if (!res.ok) {
      // Sessiz kalma: ağ hatasında "Henüz mesaj yok" yanıltıcı olur.
      toast('Mesajlar yüklenemedi', true)
      return
    }
    const body = await res.json()
    const fresh = body.messages ?? []
    if (before) {
      // Eskiler listenin SONUNA eklenir (state en yeniden eskiye sıralı)
      const existing = state.messages[taskId] ?? []
      const seen = new Set(existing.map((m) => m.id))
      state.messages[taskId] = [...existing, ...fresh.filter((m) => !seen.has(m.id))]
      state.hasOlder[taskId] = fresh.length >= 100
    } else {
      state.messages[taskId] = fresh
      state.hasOlder[taskId] = fresh.length >= 100
    }
    // Sohbet açıksa yeniden çiz (polling sonrası)
    if (state.openTaskId === taskId && $('chat').classList.contains('on')) {
      renderMessages(taskId)
    }
    // Paneldeki mesaj sayısını güncelle
    if (state.openTaskId === taskId) {
      $('chatCount').textContent = String(state.messages[taskId]?.length ?? 0)
    }
    // KARTTAKİ "N mesaj" rozetini de tazele — yoksa yalnız açık görev
    // için görünür, diğerleri hiç güncellenmez.
    const card = document.querySelector(`[data-task-id="${CSS.escape(taskId)}"]`)
    const task = state.tasks.find((t) => t.id === taskId)
    if (card && task) fillCard(card, task)
  } catch {
    toast('Mesajlar yüklenemedi', true)
  }
}

async function sendMessage(taskId, text) {
  const btn = $('sendBtn')
  btn.disabled = true
  try {
    const res = await apiFetch(`/helper/tasks/${taskId}/messages`, {
      method: 'POST',
      body: JSON.stringify({
        body: text,
        // Ağ tekrarında kopya oluşmasın
        idempotencyKey: `${taskId}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      }),
    })
    if (!res.ok) {
      toast('Mesaj gönderilemedi', true)
      return false
    }
    const body = await res.json()
    state.messages[taskId] = [body.message, ...(state.messages[taskId] ?? [])]
    renderMessages(taskId)
    $('chatCount').textContent = String(state.messages[taskId].length)
    return true
  } catch {
    toast('Bağlantı hatası', true)
    return false
  } finally {
    btn.disabled = false
  }
}

// ===========================================================================
// Durum değiştirme — iyimser güncelleme + geri alma
// ===========================================================================

async function changeStatus(taskId, status) {
  const task = state.tasks.find((t) => t.id === taskId)
  if (!task) return

  // YARIŞ KORUMASI: kullanıcı hızlıca iki farklı duruma basarsa,
  // ilk isteğin geç dönen hatası ikinci seçimi ezip yanlış duruma
  // döndürürdü. Görev başına tek uçuşta istek.
  if (state.statusInFlight?.[taskId]) return
  state.statusInFlight = state.statusInFlight ?? {}
  state.statusInFlight[taskId] = true

  const previous = task.status
  task.status = status

  // Kartı YERİNDE güncelle — tüm listeyi yeniden çizme (kaydırma korunur)
  const card = document.querySelector(`[data-task-id="${CSS.escape(taskId)}"]`)
  if (card) fillCard(card, task)

  // Filtre artık uyuşmuyorsa kartı listeden kaldır — aksi halde
  // "Bitti" filtresinde "Yapılacak" rozetli kart polling'e kadar kalır.
  if (card && state.filter !== 'ALL' && task.status !== state.filter) {
    card.remove()
    if (document.querySelectorAll('.task').length === 0) $('empty').hidden = false
  }
  renderTabs()

  // Paneldeki buton durumlarını güncelle
  const row = $('statusRow')
  for (const b of row.querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.textContent === STATUS_LABELS[status]))
  }

  try {
    const res = await apiFetch(`/helper/tasks/${taskId}`, {
      method: 'PATCH',
      body: JSON.stringify({ status }),
    })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    toast('Durum güncellendi')
  } catch {
    // Geri al
    task.status = previous
    if (card) fillCard(card, task)
    renderTabs()
    for (const b of row.querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b.textContent === STATUS_LABELS[previous]))
    }
    toast('Durum değiştirilemedi', true)
  } finally {
    delete state.statusInFlight[taskId]
  }
}

/**
 * Oturum aç — token gövdede, URL'de değil (SECURITY §1.2 #4).
 * Başarılıysa çerezler tarayıcıya yazılır, CSRF değeri bellekte tutulur.
 */
async function openSession() {
  const res = await fetch(`${API}/helper/session`, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ token: state.token }),
  })
  if (!res.ok) return false
  const body = await res.json()
  state.csrf = body.csrfToken
  state.helperName = body.helperName
  state.coupleNames = body.coupleNames
  // CSRF'i sekmeye yaz: sayfa yenilenince bellek sıfırlanır, çerez
  // durur ama CSRF kaybolur → her istek 401 → "geçersiz bağlantı".
  try { sessionStorage.setItem('helper_csrf', state.csrf) } catch {}
  return true
}

/** Kayıtlı CSRF'i geri yükle (sayfa yenilenmesi sonrası). */
function restoreCsrf() {
  try {
    const saved = sessionStorage.getItem('helper_csrf')
    if (saved) state.csrf = saved
  } catch {}
}

/** Ortak fetch — çerez + CSRF; oturum düştüyse bir kez yeniler. */
async function apiFetch(path, options = {}) {
  const build = () => ({
    credentials: 'include',
    ...options,
    headers: {
      Accept: 'application/json',
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      ...(state.csrf ? { 'X-CSRF-Token': state.csrf } : {}),
      ...(options.headers ?? {}),
    },
  })
  // CSRF yoksa (sayfa yenilendi) sessionStorage'dan geri yükle.
  // Oturum çerezi kalıcı olduğu için bu yeterli.
  if (!state.csrf) restoreCsrf()

  let res = await fetch(`${API}${path}`, build())
  if (res.status === 401 && state.token) {
    // Oturum süresi dolmuş olabilir; token hâlâ geçerliyse yeniden aç
    if (await openSession()) res = await fetch(`${API}${path}`, build())
  }
  return res
}

/**
 * Canlı güncelleme — görev ve sohbet yenilemesi.
 *
 * Görünür sekmede 15 sn'de bir tazeler. Sekme gizlenince tamamen durur
 * (pil ve veri tasarrufu); sekmeye dönülünce yeniden başlar.
 */
let pollTimer = null
let pollMs = 15000

function startPolling() {
  stopPolling()
  pollTimer = setInterval(async () => {
    if (document.hidden) return
    try {
      const res = await apiFetch('/helper/tasks')
      if (!res.ok) return
      const body = await res.json()
      const fresh = body.tasks ?? []
      const changed = JSON.stringify(fresh) !== JSON.stringify(state.tasks)
      if (changed) {
        state.tasks = fresh
        renderTabs()
        renderList()
      }
      // Açık sohbet varsa mesajları da tazele
      if (state.openTaskId) await loadMessages(state.openTaskId)
    } catch {
      // Sessiz geç: ağ hatası polling'i durdurmasın
    }
  }, pollMs)
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
}

// Sekme gizlenince durdur, görününce yeniden başlat.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopPolling()
  } else if (!$('list').hidden) {
    startPolling()
  }
})

async function load() {
  state.token = getToken()

  // Token yoksa (sayfa yenilendi / bağlantı yer iminden açıldı) oturum
  // çerezi hâlâ geçerli olabilir.
  //
  // ÖNEMLİ: GET istekleri YALNIZCA oturum çerezi ister; CSRF başlığı
  // sadece yazma isteklerinde (PATCH/POST/DELETE) doğrulanıyor
  // (bkz. backend `requireCsrf`). Bu yüzden CSRF yoksa bile denemeliyiz —
  // aksi halde sekme depolaması temizlenmiş kullanıcı, oturumu capcanlı
  // dururken "geçersiz bağlantı" görür.
  if (!state.token) {
    restoreCsrf()
    const probe = await apiFetch('/helper/tasks')
    if (probe.ok) {
      // Oturum yaşıyor — doğrudan listeyi çiz
      const body = await probe.json()
      state.helperName = body.helperName ?? state.helperName
      state.coupleNames = body.coupleNames ?? state.coupleNames
      state.tasks = body.tasks ?? []
      $('greeting').textContent = `Merhaba ${state.helperName}`
      $('coupleLine').textContent = `${state.coupleNames} düğünü için görevleriniz`
      show('list')
      renderTabs()
      renderList()
      startPolling()
      return
    }
    $('errorText').textContent = 'Bağlantı eksik. Lütfen çiftten gelen bağlantıyı kullanın.'
    show('error')
    return
  }

  try {
    // Uzun ömürlü token yalnızca oturum açar; veri istekleri çerezle.
    const opened = await openSession()
    if (!opened) {
      $('errorText').textContent =
        'Bu bağlantı geçersiz veya erişimi kapatılmış. Lütfen çift ile iletişime geçin.'
      show('error')
      return
    }
    // Token artık gerekmedi: adres çubuğundan ve geçmişten temizle
    if (location.hash) history.replaceState(null, '', location.pathname)

    const res = await apiFetch('/helper/tasks')

    if (res.status === 404) {
      $('errorText').textContent =
        'Bu bağlantı geçersiz veya erişimi kapatılmış. Lütfen çift ile iletişime geçin.'
      show('error')
      return
    }
    if (!res.ok) throw new Error('HTTP ' + res.status)

    const body = await res.json()
    state.helperName = body.helperName ?? state.helperName
    state.coupleNames = body.coupleNames ?? state.coupleNames
    state.tasks = body.tasks ?? []

    $('greeting').textContent = `Merhaba ${state.helperName}`
    $('coupleLine').textContent = `${state.coupleNames} düğünü için görevleriniz`

    show('list')
    renderTabs()
    renderList()
    startPolling()
  } catch (err) {
    $('errorText').textContent = 'Bağlantı kurulamadı. İnternet bağlantınızı kontrol edin.'
    show('error')
    console.error(err)
  }
}

// ===========================================================================
// Olay bağlama
// ===========================================================================

$('scrim').addEventListener('click', closeSheet)
$('chatLink').addEventListener('click', () => {
  const id = state.openTaskId
  if (id) openChat(id)
})
$('backBtn').addEventListener('click', closeChat)
$('retryBtn').addEventListener('click', () => { show('loading'); load() })

$('sendBtn').addEventListener('click', async () => {
  const input = $('msgInput')
  const text = input.value.trim()
  if (!text || !state.openTaskId) return
  const ok = await sendMessage(state.openTaskId, text)
  if (ok) input.value = ''
})
$('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('sendBtn').click() }
})

initSheetDrag()
load()

// TEST KANCASI — yalnız yerel geliştirmede (localhost).
//
// Üretimde (dugunce.com.tr) hiçbir şey açığa çıkmaz.
// `state` DOĞRUDAN verilmez: CSRF token'ı ve oturum bilgisi global
// nesnede durmasın. Testler yalnız davranış fonksiyonlarını görür;
// veri kurmak için `seed()` kullanılır.
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  window.__helper = {
    seed(tasks, coupleNames) {
      state.tasks = tasks ?? []
      state.coupleNames = coupleNames ?? state.coupleNames
      renderTabs(); renderList()
    },
    get tasks() { return state.tasks },
    get filter() { return state.filter },
    get openTaskId() { return state.openTaskId },
    setMessages(taskId, msgs) { state.messages[taskId] = msgs },
    renderTabs, renderList, openSheet, closeSheet,
    openChat, closeChat, renderMessages, show, changeStatus, loadMessages,
  }
}

</script>
</body>
