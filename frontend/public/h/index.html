<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4a5f45">
<title>Görevlerim — Düğünce</title>
<!--
  Yardımcı uygulaması. UYGULAMA KURULMAZ, HESAP YOK.
  Erişim yalnızca URL fragment'indeki token ile (#token).
  Fragment sunucuya gitmez, erişim loglarına düşmez.
-->
<style>
  /* ===================================================================
     Görsel dil — landing sayfasıyla aynı (Playfair + Josefin, krem/sage/altın)
     =================================================================== */
  @font-face{font-family:'Playfair Display';font-weight:600;font-display:swap;
    src:url('/assets/fonts/playfair-display-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:'Playfair Display';font-weight:600;font-display:swap;
    src:url('/assets/fonts/playfair-display-latin.woff2') format('woff2')}
  @font-face{font-family:'Josefin Sans';font-weight:400;font-display:swap;
    src:url('/assets/fonts/josefin-sans-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:'Josefin Sans';font-weight:400;font-display:swap;
    src:url('/assets/fonts/josefin-sans-latin.woff2') format('woff2')}
  @font-face{font-family:'Josefin Sans';font-weight:600;font-display:swap;
    src:url('/assets/fonts/josefin-sans-600-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:'Josefin Sans';font-weight:600;font-display:swap;
    src:url('/assets/fonts/josefin-sans-600-latin.woff2') format('woff2')}

  :root{
    --cream:#f4f2ee;--surface:#fff;--surface-alt:#faf8f4;
    --ink:#2d3a2e;--muted:#7a746a;--line:#e6e1d8;
    --sage:#4a5f45;--sage-deep:#3b4c37;--sage-soft:#eef2ec;--sage-border:#d6e0d2;
    --gold:#a8925f;--gold-soft:#f0ece0;
    --doing:#b8863b;--danger:#a35b4a;
    --radius:16px;--sheet-radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:'Josefin Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 0 40px}

  /* --- Başlık --- */
  .head{padding:20px 20px 14px}
  .brand{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);margin:0 0 8px;font-weight:600}
  .greet{font-family:'Playfair Display',Georgia,serif;font-size:24px;
    font-weight:600;margin:0 0 3px;letter-spacing:-.01em;line-height:1.25}
  .couple{font-size:13px;color:var(--muted);margin:0}

  /* --- Kart --- */
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;
    margin:0 0 12px;box-shadow:0 1px 3px rgba(45,58,46,.05)}

  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header id="head" hidden>
    <p class="brand">Düğünce · Görevlerim</p>
    <h1 id="greeting"></h1>
    <p class="sub" id="coupleLine"></p>
  </header>

  <div class="card" id="loading">
    <div class="center">
      <div class="spinner" aria-hidden="true"></div>
      <p>Yükleniyor…</p>
    </div>
  </div>

  <div class="card" id="error" hidden>
    <div class="center">
      <h2>Bağlantı geçersiz</h2>
      <p id="errorText">Bu bağlantının süresi dolmuş veya erişimi kapatılmış olabilir.<br>Lütfen çift ile iletişime geçin.</p>
    </div>
  </div>

  <div id="list"></div>

  <div class="card" id="empty" hidden>
    <div class="center">
      <p>Henüz size atanmış bir görev yok.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/**
 * Yardımcı görev uygulaması.
 *
 * Akış:
 *   1. Token'ı #fragment'ten oku (sunucuya gitmez)
 *   2. POST /api/v1/helper/session  → kısa ömürlü oturum çerezi
 *   3. GET /api/v1/helper/tasks     → oturumla
 *   3. Durum değiştir → PATCH (yalnızca status)
 *   4. Sohbet → GET/POST messages (sayfalı)
 *
 * GÜVENLİK: Sayfa yüklenirken hiçbir yazma yapılmaz. Sadece GET.
 */
const API = 'https://api.dugunce.com.tr/api/v1'
const STATUS_LABELS = { TODO: 'Yapılacak', DOING: 'Yapılıyor', DONE: 'Bitti' }

const state = {
  token: '',
  csrf: '',
  helperName: '',
  coupleNames: '',
  tasks: [],
  openTaskId: null,
  messages: {},   // taskId -> Message[]
}

const $ = (id) => document.getElementById(id)

function getToken() {
  const hash = location.hash.replace(/^#/, '')
  if (hash) return hash
  const m = location.pathname.match(/\/h\/([A-Za-z0-9_-]+)$/)
  return m ? m[1] : ''
}

function toast(msg, isError = false) {
  const el = $('toast')
  el.textContent = msg
  el.className = 'toast show' + (isError ? ' err' : '')
  clearTimeout(toast._t)
  toast._t = setTimeout(() => { el.className = 'toast' }, 2600)
}

function show(which) {
  $('loading').hidden = which !== 'loading'
  $('error').hidden = which !== 'error'
  $('head').hidden = which === 'error' || which === 'loading'
  $('list').hidden = which !== 'list'
}

function formatDate(d) {
  if (!d) return ''
  try {
    return new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(d))
  } catch { return '' }
}

/** DOM'u elle kur — innerHTML KULLANMA (XSS). */
function buildTask(task) {
  const card = document.createElement('div')
  card.className = 'card task'
  card.dataset['taskId'] = task.id

  const top = document.createElement('div')
  top.className = 'task-top'

  const body = document.createElement('div')
  body.className = 'task-body'

  const title = document.createElement('p')
  title.className = 'task-title'
  title.textContent = task.title
  body.append(title)

  if (task.dueDate) {
    const meta = document.createElement('p')
    meta.className = 'task-meta'
    meta.textContent = 'Son tarih: ' + formatDate(task.dueDate)
    body.append(meta)
  }

  const badge = document.createElement('span')
  badge.className = 'badge ' + task.status
  badge.textContent = STATUS_LABELS[task.status] ?? task.status

  top.append(body, badge)

  // Detay
  const detail = document.createElement('div')
  detail.className = 'detail'

  const desc = document.createElement('p')
  desc.className = 'desc' + (task.description ? '' : ' empty')
  desc.textContent = task.description || 'Açıklama yok'
  detail.append(desc)

  // Durum butonları
  const row = document.createElement('div')
  row.className = 'status-row'
  for (const s of ['TODO', 'DOING', 'DONE']) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.textContent = STATUS_LABELS[s]
    btn.setAttribute('aria-pressed', String(task.status === s))
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      if (task.status !== s) changeStatus(task.id, s)
    })
    row.append(btn)
  }
  detail.append(row)

  // Sohbet
  const chat = document.createElement('div')
  chat.className = 'chat'
  const h3 = document.createElement('h3')
  h3.textContent = 'Mesajlar'
  const msgs = document.createElement('div')
  msgs.className = 'msgs'
  msgs.dataset['msgsFor'] = task.id
  const form = document.createElement('div')
  form.className = 'send'
  const input = document.createElement('input')
  input.type = 'text'
  input.placeholder = 'Mesaj yaz…'
  input.maxLength = 4000
  input.setAttribute('aria-label', 'Mesaj')
  const sendBtn = document.createElement('button')
  sendBtn.type = 'button'
  sendBtn.textContent = 'Gönder'

  const doSend = async () => {
    const text = input.value.trim()
    if (!text) return
    sendBtn.disabled = true
    try {
      await sendMessage(task.id, text)
      input.value = ''
    } finally {
      sendBtn.disabled = false
    }
  }
  sendBtn.addEventListener('click', (e) => { e.stopPropagation(); doSend() })
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doSend() }
  })
  input.addEventListener('click', (e) => e.stopPropagation())

  form.append(input, sendBtn)
  chat.append(h3, msgs, form)
  detail.append(chat)

  card.append(top, detail)

  card.addEventListener('click', () => toggleTask(task.id))
  return card
}

function renderList() {
  const list = $('list')
  list.textContent = ''

  if (state.tasks.length === 0) {
    $('empty').hidden = false
    return
  }
  $('empty').hidden = true

  for (const t of state.tasks) {
    const el = buildTask(t)
    if (t.id === state.openTaskId) el.classList.add('open')
    list.append(el)
  }

  // Açık görevin mesajlarını yükle
  if (state.openTaskId) {
    const t = state.tasks.find((x) => x.id === state.openTaskId)
    if (t) loadMessages(t.id)
  }
}

function renderMessages(taskId) {
  const box = document.querySelector(`[data-msgs-for="${CSS.escape(taskId)}"]`)
  if (!box) return
  box.textContent = ''

  const msgs = state.messages[taskId] ?? []
  if (msgs.length === 0) {
    const p = document.createElement('p')
    p.className = 'msgs-empty'
    p.textContent = 'Henüz mesaj yok.'
    box.append(p)
    return
  }

  // Eski → yeni
  for (const m of [...msgs].reverse()) {
    const div = document.createElement('div')
    div.className = 'msg ' + m.senderKind
    const who = document.createElement('span')
    who.className = 'who'
    who.textContent = m.senderKind === 'COUPLE' ? state.coupleNames : 'Siz'
    const txt = document.createElement('span')
    txt.textContent = m.body
    div.append(who, txt)
    box.append(div)
  }
  box.scrollTop = box.scrollHeight
}

function toggleTask(taskId) {
  state.openTaskId = state.openTaskId === taskId ? null : taskId
  renderList()
}

async function loadMessages(taskId) {
  try {
    const res = await apiFetch(`/helper/tasks/${taskId}/messages`)
    if (!res.ok) return
    const body = await res.json()
    state.messages[taskId] = body.messages ?? []
    renderMessages(taskId)
  } catch { /* sessiz */ }
}

async function sendMessage(taskId, text) {
  try {
    const res = await apiFetch(`/helper/tasks/${taskId}/messages`, {
      method: 'POST',
      body: JSON.stringify({
        body: text,
        // Ağ tekrarında kopya oluşmasın
        idempotencyKey: `${taskId}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      }),
    })
    if (!res.ok) {
      toast('Mesaj gönderilemedi', true)
      return
    }
    const body = await res.json()
    state.messages[taskId] = [body.message, ...(state.messages[taskId] ?? [])]
    renderMessages(taskId)
  } catch {
    toast('Bağlantı hatası', true)
  }
}

async function changeStatus(taskId, status) {
  try {
    const res = await apiFetch(`/helper/tasks/${taskId}`, {
      method: 'PATCH',
      body: JSON.stringify({ status }),
    })
    if (!res.ok) {
      toast('Durum değiştirilemedi', true)
      return
    }
    const t = state.tasks.find((x) => x.id === taskId)
    if (t) t.status = status
    renderList()
    toast('Durum güncellendi')
  } catch {
    toast('Bağlantı hatası', true)
  }
}

/**
 * Oturum aç — token gövdede, URL'de değil (SECURITY §1.2 #4).
 * Başarılıysa çerezler tarayıcıya yazılır, CSRF değeri bellekte tutulur.
 */
async function openSession() {
  const res = await fetch(`${API}/helper/session`, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ token: state.token }),
  })
  if (!res.ok) return false
  const body = await res.json()
  state.csrf = body.csrfToken
  state.helperName = body.helperName
  state.coupleNames = body.coupleNames
  // CSRF'i sekmeye yaz: sayfa yenilenince bellek sıfırlanır, çerez
  // durur ama CSRF kaybolur → her istek 401 → "geçersiz bağlantı".
  try { sessionStorage.setItem('helper_csrf', state.csrf) } catch {}
  return true
}

/** Kayıtlı CSRF'i geri yükle (sayfa yenilenmesi sonrası). */
function restoreCsrf() {
  try {
    const saved = sessionStorage.getItem('helper_csrf')
    if (saved) state.csrf = saved
  } catch {}
}

/** Ortak fetch — çerez + CSRF; oturum düştüyse bir kez yeniler. */
async function apiFetch(path, options = {}) {
  const build = () => ({
    credentials: 'include',
    ...options,
    headers: {
      Accept: 'application/json',
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      ...(state.csrf ? { 'X-CSRF-Token': state.csrf } : {}),
      ...(options.headers ?? {}),
    },
  })
  // CSRF yoksa (sayfa yenilendi) sessionStorage'dan geri yükle.
  // Oturum çerezi kalıcı olduğu için bu yeterli.
  if (!state.csrf) restoreCsrf()

  let res = await fetch(`${API}${path}`, build())
  if (res.status === 401 && state.token) {
    // Oturum süresi dolmuş olabilir; token hâlâ geçerliyse yeniden aç
    if (await openSession()) res = await fetch(`${API}${path}`, build())
  }
  return res
}

/**
 * Canlı güncelleme — görev ve sohbet yenilemesi.
 *
 * ÖNCE: yardımcı sayfayı elle yenilemek zorundaydı; yenileyince token
 * URL'de olmadığı için "geçersiz bağlantı" alıyordu. Artık sayfa açık
 * kaldıkça kendini günceller.
 *
 * Görünür sekmede 15 sn'de bir tazeler. Sekme gizlenince tamamen durur
 * (pil ve veri tasarrufu); sekmeye dönülünce yeniden başlar.
 */
let pollTimer = null
let pollMs = 15000

function startPolling() {
  stopPolling()
  pollTimer = setInterval(async () => {
    if (document.hidden) return
    try {
      const res = await apiFetch('/helper/tasks')
      if (!res.ok) return
      const body = await res.json()
      const fresh = body.tasks ?? []
      // Değişiklik var mı? (JSON karşılaştırma — küçük liste)
      const changed = JSON.stringify(fresh) !== JSON.stringify(state.tasks)
      if (changed) {
        state.tasks = fresh
        renderList()
      }
      // Açık sohbet varsa mesajları da tazele
      if (state.openTaskId) await loadMessages(state.openTaskId)
    } catch {
      // Sessiz geç: ağ hatası polling'i durdurmasın
    }
  }, pollMs)
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
}

// Sekme gizlenince durdur, görününce yeniden başlat.
// Koşul CSRF'e değil, listenin görünür olmasına bağlı: oturum açıldıysa
// liste gösterilir ve polling her hâlükârda yeniden başlamalı.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopPolling()
  } else if (!$('list').hidden) {
    startPolling()
  }
})

async function load() {
  state.token = getToken()

  // Token yoksa (sayfa yenilendi / bağlantı yer iminden açıldı) oturum
  // çerezi hâlâ geçerli olabilir.
  //
  // ÖNEMLİ: GET istekleri YALNIZCA oturum çerezi ister; CSRF başlığı
  // sadece yazma isteklerinde (PATCH/POST/DELETE) doğrulanıyor
  // (bkz. backend `requireCsrf`). Bu yüzden CSRF yoksa bile denemeliyiz —
  // aksi halde sekme depolaması temizlenmiş kullanıcı, oturumu capcanlı
  // dururken "geçersiz bağlantı" görür.
  if (!state.token) {
    restoreCsrf()
    const probe = await apiFetch('/helper/tasks')
    if (probe.ok) {
      // Oturum yaşıyor — doğrudan listeyi çiz
      const body = await probe.json()
      state.helperName = body.helperName ?? state.helperName
      state.coupleNames = body.coupleNames ?? state.coupleNames
      state.tasks = body.tasks ?? []
      $('greeting').textContent = `Merhaba ${state.helperName}`
      $('coupleLine').textContent = `${state.coupleNames} düğünü için görevleriniz`
      show('list')
      renderList()
      startPolling()
      return
    }
    $('errorText').textContent = 'Bağlantı eksik. Lütfen çiftten gelen bağlantıyı kullanın.'
    show('error')
    return
  }

  try {
    // Uzun ömürlü token yalnızca oturum açar; veri istekleri çerezle.
    const opened = await openSession()
    if (!opened) {
      $('errorText').textContent =
        'Bu bağlantı geçersiz veya erişimi kapatılmış. Lütfen çift ile iletişime geçin.'
      show('error')
      return
    }
    // Token artık gerekmedi: adres çubuğundan ve geçmişten temizle
    if (location.hash) history.replaceState(null, '', location.pathname)

    const res = await apiFetch('/helper/tasks')

    if (res.status === 404) {
      $('errorText').textContent =
        'Bu bağlantı geçersiz veya erişimi kapatılmış. Lütfen çift ile iletişime geçin.'
      show('error')
      return
    }
    if (!res.ok) throw new Error('HTTP ' + res.status)

    const body = await res.json()
    state.helperName = body.helperName ?? state.helperName
    state.coupleNames = body.coupleNames ?? state.coupleNames
    state.tasks = body.tasks ?? []

    $('greeting').textContent = `Merhaba ${state.helperName}`
    $('coupleLine').textContent = `${state.coupleNames} düğünü için görevleriniz`

    show('list')
    renderList()
    startPolling()
  } catch (err) {
    $('errorText').textContent = 'Bağlantı kurulamadı. İnternet bağlantınızı kontrol edin.'
    show('error')
    console.error(err)
  }
}

load()
</script>
</body>
</html>
