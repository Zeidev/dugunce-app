<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4a5f45">
<title>Görevlerim — Düğünce</title>
<!--
  Yardımcı uygulaması. UYGULAMA KURULMAZ, HESAP YOK.
  Erişim yalnızca URL fragment'indeki token ile (#token).
  Fragment sunucuya gitmez, erişim loglarına düşmez.
-->
<style>
  :root{
    --bg:#f4f2ee;--card:#fff;--ink:#2d3a2e;--muted:#7a746a;
    --line:#e6e1d8;--accent:#4a5f45;--accent-ink:#fff;
    --todo:#8a8578;--doing:#b8863b;--done:#4a5f45;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.55;padding:20px 14px 60px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto}
  header{margin:0 0 20px}
  .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;
        box-shadow:0 1px 2px rgba(45,58,46,.05)}
  .task{cursor:pointer;border:1.5px solid transparent;transition:border-color .12s}
  .task:active{transform:scale(.995)}
  .task.open{border-color:var(--line)}
  .task-top{display:flex;gap:12px;align-items:flex-start}
  .task-body{flex:1;min-width:0}
  .task-title{font-size:16px;font-weight:600;margin:0 0 3px;word-break:break-word}
  .task-meta{font-size:13px;color:var(--muted);margin:0}
  .badge{
    flex:none;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
    letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;
  }
  .badge.TODO{background:#f0eeea;color:var(--todo)}
  .badge.DOING{background:#fbf3e4;color:var(--doing)}
  .badge.DONE{background:#eef2ec;color:var(--done)}

  .detail{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:none}
  .task.open .detail{display:block}
  .desc{font-size:14px;color:var(--ink);margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
  .desc.empty{color:var(--muted);font-style:italic}

  .status-row{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .status-row button{
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);min-height:40px;
  }
  .status-row button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .status-row button:disabled{opacity:.5;cursor:not-allowed}

  /* Sohbet */
  .chat{margin:16px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
  .chat h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
           margin:0 0 10px;font-weight:600}
  .msgs{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
  .msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:14px;word-break:break-word;white-space:pre-wrap}
  .msg.COUPLE{background:#eef2ec;color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.HELPER{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .who{display:block;font-size:11px;opacity:.7;margin:0 0 2px;font-weight:600}
  .msgs-empty{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 12px}

  .send{display:flex;gap:8px}
  .send input{
    flex:1;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;
    border:1.5px solid var(--line);background:#fff;min-width:0;
  }
  .send input:focus{outline:none;border-color:var(--accent)}
  .send button{
    font:inherit;font-weight:600;font-size:15px;padding:0 18px;border-radius:10px;
    border:0;background:var(--accent);color:#fff;cursor:pointer;min-height:44px;
  }
  .send button:disabled{opacity:.5;cursor:not-allowed}

  .center{text-align:center;padding:48px 8px}
  .center h2{font-size:18px;margin:0 0 8px}
  .center p{color:var(--muted);font-size:14px;margin:0}
  .spinner{width:26px;height:26px;margin:0 auto 18px;border-radius:50%;
           border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;
    opacity:0;transition:transform .22s ease,opacity .22s ease;pointer-events:none;z-index:10;
    max-width:90vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{background:#a35b4a}

  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header id="head" hidden>
    <p class="brand">Düğünce · Görevlerim</p>
    <h1 id="greeting"></h1>
    <p class="sub" id="coupleLine"></p>
  </header>

  <div class="card" id="loading">
    <div class="center">
      <div class="spinner" aria-hidden="true"></div>
      <p>Yükleniyor…</p>
    </div>
  </div>

  <div class="card" id="error" hidden>
    <div class="center">
      <h2>Bağlantı geçersiz</h2>
      <p id="errorText">Bu bağlantının süresi dolmuş veya erişimi kapatılmış olabilir.<br>Lütfen çift ile iletişime geçin.</p>
    </div>
  </div>

  <div id="list"></div>

  <div class="card" id="empty" hidden>
    <div class="center">
      <p>Henüz size atanmış bir görev yok.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/**
 * Yardımcı görev uygulaması.
 *
 * Akış:
 *   1. Token'ı #fragment'ten oku (sunucuya gitmez)
 *   2. GET /api/v1/helper/:token/tasks
 *   3. Durum değiştir → PATCH (yalnızca status)
 *   4. Sohbet → GET/POST messages (sayfalı)
 *
 * GÜVENLİK: Sayfa yüklenirken hiçbir yazma yapılmaz. Sadece GET.
 */
const API = 'https://api.dugunce.com.tr/api/v1'
const STATUS_LABELS = { TODO: 'Yapılacak', DOING: 'Yapılıyor', DONE: 'Bitti' }

const state = {
  token: '',
  helperName: '',
  coupleNames: '',
  tasks: [],
  openTaskId: null,
  messages: {},   // taskId -> Message[]
}

const $ = (id) => document.getElementById(id)

function getToken() {
  const hash = location.hash.replace(/^#/, '')
  if (hash) return hash
  const m = location.pathname.match(/\/h\/([A-Za-z0-9_-]+)$/)
  return m ? m[1] : ''
}

function toast(msg, isError = false) {
  const el = $('toast')
  el.textContent = msg
  el.className = 'toast show' + (isError ? ' err' : '')
  clearTimeout(toast._t)
  toast._t = setTimeout(() => { el.className = 'toast' }, 2600)
}

function show(which) {
  $('loading').hidden = which !== 'loading'
  $('error').hidden = which !== 'error'
  $('head').hidden = which === 'error' || which === 'loading'
  $('list').hidden = which !== 'list'
}

function formatDate(d) {
  if (!d) return ''
  try {
    return new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(d))
  } catch { return '' }
}

/** DOM'u elle kur — innerHTML KULLANMA (XSS). */
function buildTask(task) {
  const card = document.createElement('div')
  card.className = 'card task'
  card.dataset['taskId'] = task.id

  const top = document.createElement('div')
  top.className = 'task-top'

  const body = document.createElement('div')
  body.className = 'task-body'

  const title = document.createElement('p')
  title.className = 'task-title'
  title.textContent = task.title
  body.append(title)

  if (task.dueDate) {
    const meta = document.createElement('p')
    meta.className = 'task-meta'
    meta.textContent = 'Son tarih: ' + formatDate(task.dueDate)
    body.append(meta)
  }

  const badge = document.createElement('span')
  badge.className = 'badge ' + task.status
  badge.textContent = STATUS_LABELS[task.status] ?? task.status

  top.append(body, badge)

  // Detay
  const detail = document.createElement('div')
  detail.className = 'detail'

  const desc = document.createElement('p')
  desc.className = 'desc' + (task.description ? '' : ' empty')
  desc.textContent = task.description || 'Açıklama yok'
  detail.append(desc)

  // Durum butonları
  const row = document.createElement('div')
  row.className = 'status-row'
  for (const s of ['TODO', 'DOING', 'DONE']) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.textContent = STATUS_LABELS[s]
    btn.setAttribute('aria-pressed', String(task.status === s))
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      if (task.status !== s) changeStatus(task.id, s)
    })
    row.append(btn)
  }
  detail.append(row)

  // Sohbet
  const chat = document.createElement('div')
  chat.className = 'chat'
  const h3 = document.createElement('h3')
  h3.textContent = 'Mesajlar'
  const msgs = document.createElement('div')
  msgs.className = 'msgs'
  msgs.dataset['msgsFor'] = task.id
  const form = document.createElement('div')
  form.className = 'send'
  const input = document.createElement('input')
  input.type = 'text'
  input.placeholder = 'Mesaj yaz…'
  input.maxLength = 4000
  input.setAttribute('aria-label', 'Mesaj')
  const sendBtn = document.createElement('button')
  sendBtn.type = 'button'
  sendBtn.textContent = 'Gönder'

  const doSend = async () => {
    const text = input.value.trim()
    if (!text) return
    sendBtn.disabled = true
    try {
      await sendMessage(task.id, text)
      input.value = ''
    } finally {
      sendBtn.disabled = false
    }
  }
  sendBtn.addEventListener('click', (e) => { e.stopPropagation(); doSend() })
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doSend() }
  })
  input.addEventListener('click', (e) => e.stopPropagation())

  form.append(input, sendBtn)
  chat.append(h3, msgs, form)
  detail.append(chat)

  card.append(top, detail)

  card.addEventListener('click', () => toggleTask(task.id))
  return card
}

function renderList() {
  const list = $('list')
  list.textContent = ''

  if (state.tasks.length === 0) {
    $('empty').hidden = false
    return
  }
  $('empty').hidden = true

  for (const t of state.tasks) {
    const el = buildTask(t)
    if (t.id === state.openTaskId) el.classList.add('open')
    list.append(el)
  }

  // Açık görevin mesajlarını yükle
  if (state.openTaskId) {
    const t = state.tasks.find((x) => x.id === state.openTaskId)
    if (t) loadMessages(t.id)
  }
}

function renderMessages(taskId) {
  const box = document.querySelector(`[data-msgs-for="${CSS.escape(taskId)}"]`)
  if (!box) return
  box.textContent = ''

  const msgs = state.messages[taskId] ?? []
  if (msgs.length === 0) {
    const p = document.createElement('p')
    p.className = 'msgs-empty'
    p.textContent = 'Henüz mesaj yok.'
    box.append(p)
    return
  }

  // Eski → yeni
  for (const m of [...msgs].reverse()) {
    const div = document.createElement('div')
    div.className = 'msg ' + m.senderKind
    const who = document.createElement('span')
    who.className = 'who'
    who.textContent = m.senderKind === 'COUPLE' ? state.coupleNames : 'Siz'
    const txt = document.createElement('span')
    txt.textContent = m.body
    div.append(who, txt)
    box.append(div)
  }
  box.scrollTop = box.scrollHeight
}

function toggleTask(taskId) {
  state.openTaskId = state.openTaskId === taskId ? null : taskId
  renderList()
}

async function loadMessages(taskId) {
  try {
    const res = await fetch(`${API}/helper/${encodeURIComponent(state.token)}/tasks/${taskId}/messages`, {
      headers: { Accept: 'application/json' },
    })
    if (!res.ok) return
    const body = await res.json()
    state.messages[taskId] = body.messages ?? []
    renderMessages(taskId)
  } catch { /* sessiz */ }
}

async function sendMessage(taskId, text) {
  try {
    const res = await fetch(
      `${API}/helper/${encodeURIComponent(state.token)}/tasks/${taskId}/messages`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          body: text,
          // Ağ tekrarında kopya oluşmasın
          idempotencyKey: `${taskId}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        }),
      },
    )
    if (!res.ok) {
      toast('Mesaj gönderilemedi', true)
      return
    }
    const body = await res.json()
    state.messages[taskId] = [body.message, ...(state.messages[taskId] ?? [])]
    renderMessages(taskId)
  } catch {
    toast('Bağlantı hatası', true)
  }
}

async function changeStatus(taskId, status) {
  try {
    const res = await fetch(
      `${API}/helper/${encodeURIComponent(state.token)}/tasks/${taskId}`,
      {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ status }),
      },
    )
    if (!res.ok) {
      toast('Durum değiştirilemedi', true)
      return
    }
    const t = state.tasks.find((x) => x.id === taskId)
    if (t) t.status = status
    renderList()
    toast('Durum güncellendi')
  } catch {
    toast('Bağlantı hatası', true)
  }
}

async function load() {
  state.token = getToken()
  if (!state.token) {
    $('errorText').textContent = 'Bağlantı eksik. Lütfen çiftten gelen bağlantıyı kullanın.'
    show('error')
    return
  }

  try {
    const res = await fetch(`${API}/helper/${encodeURIComponent(state.token)}/tasks`, {
      headers: { Accept: 'application/json' },
    })

    if (res.status === 404) {
      $('errorText').textContent =
        'Bu bağlantı geçersiz veya erişimi kapatılmış. Lütfen çift ile iletişime geçin.'
      show('error')
      return
    }
    if (!res.ok) throw new Error('HTTP ' + res.status)

    const body = await res.json()
    state.helperName = body.helperName
    state.coupleNames = body.coupleNames
    state.tasks = body.tasks ?? []

    $('greeting').textContent = `Merhaba ${state.helperName}`
    $('coupleLine').textContent = `${state.coupleNames} düğünü için görevleriniz`

    show('list')
    renderList()
  } catch (err) {
    $('errorText').textContent = 'Bağlantı kurulamadı. İnternet bağlantınızı kontrol edin.'
    show('error')
    console.error(err)
  }
}

load()
</script>
</body>
</html>
