<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Düğünce — Giriş</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>
  :root{--sage:#4a5f45;--cream:#f4f2ee;--ink:#2d3a2e;--muted:#6a6459;--line:#e6e1d8;--ok:#4a7c59;--err:#a35b4a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding:24px}
  .card{max-width:420px;width:100%;background:#fff;border-radius:20px;padding:32px 28px;
        box-shadow:0 1px 3px rgba(45,58,46,.08),0 8px 24px rgba(45,58,46,.06);text-align:center}
  .icon{width:64px;height:64px;border-radius:50%;background:#eef2ec;display:grid;place-items:center;margin:0 auto 20px;font-size:28px}
  h1{font-size:22px;margin:0 0 10px;font-weight:600}
  p{margin:0 0 18px;color:var(--muted);font-size:15px}
  .code{font-size:34px;letter-spacing:8px;font-weight:600;color:var(--sage);
        background:#eef2ec;border-radius:12px;padding:14px 8px;margin:18px 0;font-variant-numeric:tabular-nums}
  .btn{display:inline-block;width:100%;padding:14px 20px;border-radius:12px;background:var(--sage);
       color:#fff;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--sage);border:1.5px solid #d6e0d2;margin-top:10px}
  .err{color:var(--err);background:#fbf3f1;border-radius:12px;padding:14px;font-size:14px;margin:16px 0}
  .hint{font-size:13px;color:var(--muted);margin-top:16px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">✉️</div>
  <h1 id="title">Giriş yapılıyor…</h1>
  <p id="subtitle">Bağlantın kontrol ediliyor, bir saniye.</p>

  <div id="codeBox" class="hidden">
    <div class="code" id="codeValue">------</div>
    <p class="hint">Uygulamada <strong>“Kodum var”</strong> deyip bu kodu gir.</p>
  </div>

  <div id="errorBox" class="err hidden"></div>

  <div id="actions" class="hidden">
    <a class="btn" id="openApp" href="#">Uygulamayı aç</a>
  </div>

  <!-- Yedek yol: uygulama açılmazsa kodla gir -->
  <div id="fallback" class="hidden" style="margin-top:24px;padding-top:20px;border-top:1px solid #e6e1d8">
    <p style="font-size:14px;color:#6a6459;margin:0 0 8px">
      Uygulama açılmadı mı?
    </p>
    <p style="font-size:14px;color:#2d3a2e;margin:0">
      E-postandaki <strong>6 haneli kodu</strong> uygulamada
      <strong>“Kodum var”</strong> ekranına gir.
    </p>
  </div>
</div>

<script>
(function () {
  var API = 'https://api.dugunce.com.tr/api/v1';
  var icon = document.getElementById('icon');
  var title = document.getElementById('title');
  var subtitle = document.getElementById('subtitle');
  var codeBox = document.getElementById('codeBox');
  var codeValue = document.getElementById('codeValue');
  var errorBox = document.getElementById('errorBox');
  var actions = document.getElementById('actions');
  var openApp = document.getElementById('openApp');

  /**
   * Token NEREDE?
   *
   * Backend linki `https://dugunce.com.tr/auth#<token>` biçiminde
   * üretiyor — token fragment'te (sunucuya gitmez, design §7).
   * Ayrıca `?token=` biçimi de desteklenir (eski linkler / paylaşımlar).
   */
  var hash = location.hash ? location.hash.slice(1) : '';
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || (hash && hash.indexOf('=') === -1 ? hash : null);
  if (!token && hash.indexOf('token=') === 0) token = hash.slice(6);

  function fail(msg) {
    icon.textContent = '⚠️';
    title.textContent = 'Bağlantı kullanılamadı';
    subtitle.textContent = msg;
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }

  if (!token) {
    fail('Bağlantıda giriş anahtarı yok. E-postadaki bağlantının tamamını açtığından emin ol.');
    return;
  }

  /**
   * Kullanıcı uygulamada mı?
   *
   * Universal/App Link doğrulanmışsa tarayıcıya hiç gelmez. Gelmişse
   * ya uygulama kurulu değil ya da doğrulama yok — o zaman kullanıcıya
   * kodu elle girmesini söyleriz.
   */
  var isAndroid = /Android/i.test(navigator.userAgent);
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  // Özel şema ile uygulamayı açmayı dene (uygulama kuruluysa)
  var scheme = 'dugunce://auth?token=' + encodeURIComponent(token);
  openApp.href = scheme;

  /**
   * KRİTİK: Bu sayfa token'ı TÜKETMEZ.
   *
   * Token tek kullanımlık (backend `markMagicLinkUsed`). Sayfa onu
   * tüketirse uygulamaya devredilecek geçerli token kalmaz ve kullanıcı
   * "giriş onaylandı" görse bile uygulamada giriş yapmamış olur —
   * bildirilen hata tam olarak buydu.
   *
   * Doğru akış: sayfa token'ı yalnızca UYGULAMAYA iletir, tüketimi
   * uygulama `POST /auth/verify` ile yapar.
   */

  /**
   * Uygulamayı açmayı dene.
   *
   * App Links (https) doğrulanmamış olabilir — debug APK'nın imza
   * parmak izi her derlemede değişiyor, assetlinks.json eşleşmiyor.
   * Bu yüzden ÖZEL ŞEMA tek güvenilir yol.
   *
   * Strateji:
   * 1. Sayfa açılır açılmaz `location.href` ile dene
   * 2. Kısa süre sonra hâlâ buradaysek kullanıcıya buton göster
   * 3. Buton aynı şemayı çağırır
   *
   * Not: tarayıcı "uygulama açılsın mı?" sorarsa kullanıcı onaylar.
   */
  function tryOpenApp() {
    location.href = scheme;
  }

  if (isAndroid || isIOS) {
    tryOpenApp();
    // Uygulama açıldıysa bu sayfa arka planda kalır; açılmadıysa
    // kullanıcı hâlâ görüyor demektir — butonu vurgula.
  }

  icon.textContent = '📱';
  title.textContent = 'Uygulamada devam et';
  subtitle.textContent = isAndroid || isIOS
    ? 'Aşağıdaki butona dokun — giriş uygulamada tamamlanacak.'
    : 'Bu bağlantı Düğünce uygulamasında açılmalı. Telefonunda uygulama kurulu mu?';

  actions.classList.remove('hidden');
  // Uygulama açılmazsa kod yedeği her zaman görünsün
  document.getElementById('fallback').classList.remove('hidden');

  // Token'ı adres çubuğundan temizle (geçmişte kalmasın) ama DEĞİŞKENDE tut
  try { history.replaceState(null, '', '/auth/'); } catch (e) {}


})();
</script>
</body>
</html>
